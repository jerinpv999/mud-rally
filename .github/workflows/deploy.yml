# Publishes the game to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the car models are embedded
        run: |
          for k in hatch supermini coupe crossover; do
            grep -q "id=\"glb_$k\"" index.html || { echo "::error::car '$k' is not embedded - run python3 tools/embed_models.py"; exit 1; }
          done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r models _site/models
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
